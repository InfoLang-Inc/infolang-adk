[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infolang-adk"
dynamic = ["version"]
description = "InfoLang BaseMemoryService for Google ADK agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "InfoLang", email = "engineering@infolang.ai" }]
keywords = ["infolang", "google-adk", "adk", "agents", "memory", "semantic-memory", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "infolang>=0.3,<0.4",
  "google-adk>=1.0.0",
  "typing-extensions>=4.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.urls]
Homepage = "https://infolang.ai"
Documentation = "https://infolang.ai/docs/integrations/adk"
Source = "https://github.com/InfoLang-Inc/infolang-adk"
Issues = "https://github.com/InfoLang-Inc/infolang-adk/issues"

[tool.hatch.version]
path = "src/infolang_adk/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/infolang_adk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=infolang_adk --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["src/infolang_adk"]
branch = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/infolang_adk"]
